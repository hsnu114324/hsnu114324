<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Word Snake 德文貪食蛇</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top-info">
        <div class="meta">
          <span class="score-chip">分數：<b id="score">0</b></span>
          <span class="progress-chip">進度：<b id="progress">0/0</b></span>
          <div class="meta-actions">
            <a class="btn-link" href="./index.html">🧱 方塊</a>
            <a class="btn-link" href="./rpg.html">🧙 RPG</a>
            <a class="btn-link" href="./novel.html">📖 小說</a>
            <a class="btn-link" href="./settings.html">⚙ 設定</a>
            <button id="pauseBtn" type="button">⏸ 暫停</button>
            <button id="restartBtn" type="button">重新開始</button>
          </div>
        </div>
        <p id="message" class="message"></p>
        <p id="speedInfo" class="message" style="color:#7ea6ff;margin-top:2px;"></p>
      </header>

      <section class="board-wrap">
        <canvas id="board"></canvas>
      </section>
    </main>

    <script src="./snake.js"></script>
  </body>
</html>
