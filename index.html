<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字塊學堂 WordTetris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a1a;
      --panel: #111128;
      --border: #2a2a5a;
      --accent: #00ffcc;
      --accent2: #ff6b6b;
      --accent3: #ffd93d;
      --accent4: #6bcb77;
      --text: #e0e0ff;
      --dim: #5a5a8a;
      --grid-line: rgba(255,255,255,0.04);
      --glow: 0 0 20px rgba(0,255,204,0.4);
      --glow2: 0 0 20px rgba(255,107,107,0.4);

      /* Block Colors */
      --c1: #ff6b6b;
      --c2: #ffd93d;
      --c3: #6bcb77;
      --c4: #00ffcc;
      --c5: #a78bfa;
      --c6: #fb923c;
      --c7: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Scanline effect */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 1000;
    }

    /* Grid background */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* TITLE */
    .title-bar {
      width: 100%;
      text-align: center;
      padding: 20px 0 10px;
      position: relative;
    }

    .title-bar h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(14px, 3vw, 22px);
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent), 0 0 30px var(--accent), 2px 2px 0 #004433;
      letter-spacing: 2px;
      animation: titlePulse 3s ease-in-out infinite;
    }

    .title-sub {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--dim);
      margin-top: 6px;
      letter-spacing: 3px;
    }

    @keyframes titlePulse {
      0%, 100% { text-shadow: 0 0 10px var(--accent), 0 0 30px var(--accent), 2px 2px 0 #004433; }
      50% { text-shadow: 0 0 20px var(--accent), 0 0 60px var(--accent), 0 0 80px rgba(0,255,204,0.3), 2px 2px 0 #004433; }
    }

    /* MAIN LAYOUT */
    .game-wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding: 10px 20px 30px;
      position: relative;
      z-index: 1;
    }

    /* PANELS */
    .panel {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 4px;
      padding: 14px;
      position: relative;
    }

    .panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 4px;
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    .panel-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--dim);
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* LEFT PANEL */
    .left-panel { width: 180px; }

    /* SCORE */
    .score-block {
      margin-bottom: 14px;
    }

    .score-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
      color: var(--accent3);
      text-shadow: 0 0 10px rgba(255,217,61,0.6);
      line-height: 1;
    }

    .score-label { margin-top: 4px; }

    .mini-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-item {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 8px;
    }

    .stat-num {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--accent);
    }

    .stat-lbl {
      font-size: 10px;
      color: var(--dim);
      margin-top: 2px;
    }

    /* NEXT PIECE */
    .next-display {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 10px;
      margin-bottom: 14px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .next-piece-word {
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
      text-align: center;
      word-break: break-all;
    }

    .next-piece-trans {
      font-size: 11px;
      color: var(--dim);
      text-align: center;
      margin-top: 4px;
    }

    /* WORD SET SELECTOR */
    .set-selector {
      margin-bottom: 14px;
    }

    select {
      width: 100%;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 3px;
      cursor: pointer;
      outline: none;
      appearance: none;
    }

    select:focus { border-color: var(--accent); }

    /* MODE TOGGLE */
    .mode-toggle {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
    }

    .mode-btn {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      padding: 8px 4px;
      cursor: pointer;
      border-radius: 3px;
      text-align: center;
      transition: all 0.15s;
      line-height: 1.6;
    }

    .mode-btn.active {
      background: rgba(0,255,204,0.1);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: var(--glow);
    }

    .mode-btn:hover:not(.active) {
      border-color: var(--dim);
      color: var(--text);
    }

    /* CONTROL BUTTONS */
    .ctrl-btn {
      width: 100%;
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 10px;
      cursor: pointer;
      border-radius: 3px;
      margin-bottom: 8px;
      transition: all 0.15s;
      letter-spacing: 1px;
    }

    .ctrl-btn:hover {
      background: var(--accent);
      color: var(--bg);
      box-shadow: var(--glow);
    }

    .ctrl-btn.danger {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    .ctrl-btn.danger:hover {
      background: var(--accent2);
      color: var(--bg);
      box-shadow: var(--glow2);
    }

    /* GAME CANVAS AREA */
    .game-area {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(0,255,204,0.1), inset 0 0 60px rgba(0,0,0,0.8);
    }

    /* OVERLAY */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      border-radius: 4px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .overlay-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(12px, 2.5vw, 18px);
      color: var(--accent);
      text-shadow: var(--glow);
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.8;
    }

    .overlay-sub {
      font-size: 13px;
      color: var(--dim);
      margin-bottom: 24px;
      text-align: center;
      line-height: 1.8;
    }

    .overlay-btn {
      background: var(--accent);
      border: none;
      color: var(--bg);
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 14px 28px;
      cursor: pointer;
      border-radius: 3px;
      box-shadow: var(--glow);
      transition: all 0.15s;
      margin: 4px;
    }

    .overlay-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0,255,204,0.7);
    }

    /* RIGHT PANEL */
    .right-panel { width: 180px; }

    /* VOCAB LIST */
    .vocab-list {
      max-height: 300px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .vocab-list::-webkit-scrollbar { width: 4px; }
    .vocab-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .vocab-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 8px;
      border-radius: 3px;
      margin-bottom: 3px;
      font-size: 12px;
      border: 1px solid transparent;
      transition: all 0.3s;
    }

    .vocab-item.matched {
      background: rgba(107,203,119,0.15);
      border-color: rgba(107,203,119,0.3);
      color: var(--accent4);
    }

    .vocab-item.matched .v-check { color: var(--accent4); }

    .vocab-item .v-word { font-weight: 700; }
    .vocab-item .v-trans { color: var(--dim); font-size: 10px; }
    .vocab-item .v-check { color: transparent; font-size: 10px; }

    /* TABLE MODE progress */
    .table-progress {
      margin-bottom: 14px;
    }

    .progress-bar-wrap {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 2px;
      height: 8px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent4), var(--accent));
      border-radius: 2px;
      transition: width 0.5s ease;
      box-shadow: 0 0 8px rgba(0,255,204,0.5);
    }

    .progress-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--accent);
      text-align: right;
      margin-top: 4px;
    }

    /* KEYS HELP */
    .keys-grid {
      display: grid;
      gap: 5px;
    }

    .key-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: var(--dim);
    }

    .key-badge {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--border);
      border-radius: 3px;
      padding: 2px 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--text);
      min-width: 26px;
      text-align: center;
    }

    /* LEVEL display */
    .level-display {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--accent3);
      text-shadow: 0 0 8px rgba(255,217,61,0.5);
    }

    /* COMBO display */
    .combo-display {
      position: absolute;
      pointer-events: none;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(14px, 3vw, 22px);
      color: var(--accent3);
      text-shadow: 0 0 10px rgba(255,217,61,0.8);
      white-space: nowrap;
      z-index: 20;
      animation: comboPop 1s forwards;
    }

    @keyframes comboPop {
      0% { opacity: 0; transform: scale(0.5) translateY(0); }
      20% { opacity: 1; transform: scale(1.3) translateY(-10px); }
      60% { opacity: 1; transform: scale(1) translateY(-30px); }
      100% { opacity: 0; transform: scale(0.8) translateY(-60px); }
    }

    /* FLASH OVERLAY */
    .flash-overlay {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.1s;
    }

    .flash-overlay.flash-good { background: rgba(107,203,119,0.3); }
    .flash-overlay.flash-bad { background: rgba(255,107,107,0.3); }

    /* MOBILE CONTROLS */
    .mobile-controls {
      display: none;
      gap: 8px;
      margin-top: 12px;
      justify-content: center;
    }

    .m-btn {
      background: rgba(0,0,0,0.5);
      border: 2px solid var(--border);
      color: var(--text);
      width: 52px;
      height: 52px;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      user-select: none;
      -webkit-user-select: none;
    }

    .m-btn:active {
      background: rgba(0,255,204,0.2);
      border-color: var(--accent);
    }

    @media (max-width: 700px) {
      .game-wrapper { flex-direction: column; align-items: center; gap: 10px; }
      .left-panel, .right-panel { width: 100%; max-width: 400px; }
      .mini-stats { grid-template-columns: repeat(4, 1fr); }
      .mobile-controls { display: flex; flex-wrap: wrap; }
    }

    /* POPUP */
    .word-popup {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: 4px;
      padding: 10px 16px;
      text-align: center;
      pointer-events: none;
      z-index: 15;
      white-space: nowrap;
      box-shadow: var(--glow);
      animation: popupAnim 1.5s forwards;
    }

    .word-popup .wp-word { font-size: 18px; font-weight: 900; color: var(--accent); }
    .word-popup .wp-trans { font-size: 12px; color: var(--text); margin-top: 2px; }

    @keyframes popupAnim {
      0% { opacity: 0; top: 50%; }
      15% { opacity: 1; top: 45%; }
      70% { opacity: 1; top: 40%; }
      100% { opacity: 0; top: 30%; }
    }

    /* TABLE COMPLETE */
    .table-complete-overlay {
      background: rgba(0,0,0,0.9);
    }

    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: fireworkAnim 1s ease-out forwards;
    }

    @keyframes fireworkAnim {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
    }
  </style>
</head>
<body>

<div class="title-bar">
  <h1>字塊學堂</h1>
  <div class="title-sub">WORD TETRIS LEARNING</div>
</div>

<div class="game-wrapper">

  <!-- LEFT PANEL -->
  <div class="panel left-panel">
    <div class="score-block">
      <div class="panel-title">SCORE</div>
      <div class="score-value" id="scoreVal">0</div>
    </div>

    <div class="mini-stats">
      <div class="stat-item">
        <div class="stat-num level-display" id="levelVal">1</div>
        <div class="stat-lbl">LEVEL</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="linesVal">0</div>
        <div class="stat-lbl">MATCHED</div>
      </div>
    </div>

    <div class="panel-title">NEXT WORD</div>
    <div class="next-display" id="nextDisplay">
      <div>
        <div class="next-piece-word" id="nextWord">—</div>
        <div class="next-piece-trans" id="nextTrans"></div>
      </div>
    </div>

    <div class="set-selector">
      <div class="panel-title">WORD SET</div>
      <select id="wordSetSelect"></select>
    </div>

    <div class="panel-title">GAME MODE</div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeLineBtn" onclick="setMode('line')">
        ▬▬▬<br>消除<br>模式
      </button>
      <button class="mode-btn" id="modeTableBtn" onclick="setMode('table')">
        ▦▦▦<br>完整<br>模式
      </button>
    </div>

    <button class="ctrl-btn" id="startBtn" onclick="startGame()">▶ START</button>
    <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()" style="display:none">⏸ PAUSE</button>
    <button class="ctrl-btn danger" onclick="resetGame()">↺ RESET</button>
  </div>

  <!-- GAME AREA -->
  <div class="game-area" id="gameArea">
    <canvas id="gameCanvas"></canvas>
    <div class="flash-overlay" id="flashOverlay"></div>

    <!-- START OVERLAY -->
    <div class="game-overlay" id="startOverlay">
      <div class="overlay-title">字塊學堂<br><span style="font-size:0.6em;color:var(--dim)">WORD TETRIS</span></div>
      <div class="overlay-sub">
        讓單字方塊與翻譯對齊<br>
        正確配對即可消除！<br><br>
        <span style="color:var(--accent3)">← → 移動 ↓ 加速 ↑ 旋轉</span>
      </div>
      <button class="overlay-btn" onclick="startGame()">▶ 開始遊戲</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel right-panel">
    <div class="table-progress" id="tableProgress" style="display:none">
      <div class="panel-title">TABLE PROGRESS</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-text" id="progressText">0 / 0</div>
    </div>

    <div class="panel-title">VOCABULARY</div>
    <div class="vocab-list" id="vocabList"></div>

    <div class="panel" style="margin-top:14px; padding:10px; background:rgba(0,0,0,0.3)">
      <div class="panel-title">CONTROLS</div>
      <div class="keys-grid">
        <div class="key-row"><span class="key-badge">←→</span> 左右移動</div>
        <div class="key-row"><span class="key-badge">↑</span> 旋轉方向</div>
        <div class="key-row"><span class="key-badge">↓</span> 加速下降</div>
        <div class="key-row"><span class="key-badge">Space</span> 瞬間落地</div>
        <div class="key-row"><span class="key-badge">P</span> 暫停</div>
      </div>
    </div>
  </div>

</div>

<!-- MOBILE CONTROLS -->
<div class="mobile-controls">
  <div style="display:flex;gap:8px;width:100%;justify-content:center">
    <button class="m-btn" id="mBtnLeft" ontouchstart="mobilePress('left')" ontouchend="mobileRelease('left')">◀</button>
    <button class="m-btn" id="mBtnDown" ontouchstart="mobilePress('down')" ontouchend="mobileRelease('down')">▼</button>
    <button class="m-btn" id="mBtnRight" ontouchstart="mobilePress('right')" ontouchend="mobileRelease('right')">▶</button>
  </div>
  <div style="display:flex;gap:8px;width:100%;justify-content:center">
    <button class="m-btn" onclick="gameAction('rotate')">↻</button>
    <button class="m-btn" onclick="gameAction('drop')">⬇</button>
    <button class="m-btn" onclick="togglePause()">⏸</button>
  </div>
</div>

<script src="words.js"></script>
<script>
// ============================================================
// GAME ENGINE
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// CANVAS SIZE
const CELL = 52;
const COLS = 6;
const ROWS = 14;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

// Colors
const COLORS = [
  '#ff6b6b','#ffd93d','#6bcb77','#00ffcc','#a78bfa','#fb923c','#60a5fa'
];
const DARK_COLORS = [
  '#4a1f1f','#4a3f00','#1a3f22','#004433','#2a1f5a','#4a2a00','#1a2a4a'
];

// ============================================================
// GAME STATE
// ============================================================
let state = {
  board: [],       // board[row][col] = { word, translation, color, darkColor } | null
  current: null,   // { x, col, row, word, translation, color, darkColor }
  next: null,
  score: 0,
  level: 1,
  matched: 0,
  gameMode: 'line', // 'line' | 'table'
  running: false,
  paused: false,
  wordSet: [],
  wordSetName: '',
  matchedWords: new Set(),
  tableWords: [],   // For table mode: target words to complete
  dropInterval: 900,
  lastDrop: 0,
  combo: 0,
};

let dropTimer = null;
let mobileIntervals = {};

// ============================================================
// INIT WORD SETS
// ============================================================
function initWordSets() {
  const sel = document.getElementById('wordSetSelect');
  sel.innerHTML = '';
  for (const setName of Object.keys(WORD_SETS)) {
    const opt = document.createElement('option');
    opt.value = setName;
    opt.textContent = setName;
    sel.appendChild(opt);
  }
  sel.value = DEFAULT_SET;
  loadVocabList(DEFAULT_SET);
  sel.addEventListener('change', () => {
    if (!state.running) loadVocabList(sel.value);
  });
}

function loadVocabList(setName) {
  state.wordSet = [...WORD_SETS[setName]];
  state.wordSetName = setName;
  renderVocabList();
}

// ============================================================
// MODE
// ============================================================
function setMode(mode) {
  if (state.running) return;
  state.gameMode = mode;
  document.getElementById('modeLineBtn').classList.toggle('active', mode === 'line');
  document.getElementById('modeTableBtn').classList.toggle('active', mode === 'table');
  document.getElementById('tableProgress').style.display = mode === 'table' ? 'block' : 'none';
}

// ============================================================
// BOARD
// ============================================================
function createBoard() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

// ============================================================
// PIECE GENERATION
// ============================================================
function getRandomWord() {
  const words = state.wordSet;
  return words[Math.floor(Math.random() * words.length)];
}

function getRandomColor() {
  const i = Math.floor(Math.random() * COLORS.length);
  return { color: COLORS[i], darkColor: DARK_COLORS[i] };
}

function newPiece(wordData) {
  const { color, darkColor } = getRandomColor();
  const data = wordData || getRandomWord();
  return {
    col: Math.floor(COLS / 2) - 0,
    row: 0,
    word: data.word,
    translation: data.translation,
    color,
    darkColor,
    facing: 'word', // 'word' | 'translation' — rotate toggles which side shows
  };
}

// ============================================================
// START / RESET
// ============================================================
function startGame() {
  const setName = document.getElementById('wordSetSelect').value;
  loadVocabList(setName);

  state.board = createBoard();
  state.score = 0;
  state.level = 1;
  state.matched = 0;
  state.matchedWords = new Set();
  state.combo = 0;
  state.running = true;
  state.paused = false;
  state.dropInterval = 900;

  if (state.gameMode === 'table') {
    state.tableWords = [...state.wordSet];
    state.matchedWords = new Set();
    updateTableProgress();
  }

  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('pauseBtn').style.display = 'block';

  updateScore();
  renderVocabList();

  state.next = newPiece();
  spawnPiece();
  updateNextDisplay();

  if (dropTimer) cancelAnimationFrame(dropTimer);
  state.lastDrop = performance.now();
  dropTimer = requestAnimationFrame(gameLoop);
}

function resetGame() {
  if (dropTimer) cancelAnimationFrame(dropTimer);
  state.running = false;
  state.paused = false;
  state.board = createBoard();
  state.current = null;
  state.next = null;
  state.score = 0;
  state.level = 1;
  state.matched = 0;
  state.matchedWords = new Set();
  state.combo = 0;

  document.getElementById('startBtn').style.display = 'block';
  document.getElementById('pauseBtn').style.display = 'none';

  const overlay = document.getElementById('startOverlay');
  overlay.style.display = 'flex';
  overlay.querySelector('.overlay-title').innerHTML = '字塊學堂<br><span style="font-size:0.6em;color:var(--dim)">WORD TETRIS</span>';
  overlay.querySelector('.overlay-sub').innerHTML = '讓單字方塊與翻譯對齊<br>正確配對即可消除！<br><br><span style="color:var(--accent3)">← → 移動 ↓ 加速 ↑ 旋轉</span>';
  overlay.innerHTML = overlay.innerHTML; // force re-render
  // Rebuild overlay cleanly
  showStartOverlay();

  updateScore();
  renderVocabList();
  drawBoard();
}

function showStartOverlay() {
  const overlay = document.getElementById('startOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="overlay-title">字塊學堂<br><span style="font-size:0.6em;color:var(--dim)">WORD TETRIS</span></div>
    <div class="overlay-sub">
      讓單字方塊與翻譯對齊<br>
      正確配對即可消除！<br><br>
      <span style="color:var(--accent3)">← → 移動 ↓ 加速 ↑ 旋轉</span>
    </div>
    <button class="overlay-btn" onclick="startGame()">▶ 開始遊戲</button>
  `;
}

function spawnPiece() {
  state.current = state.next;
  state.current.row = 0;
  state.current.col = Math.floor(COLS / 2);
  state.next = newPiece();
  updateNextDisplay();

  // Check game over
  if (isColliding(state.current, state.current.col, state.current.row)) {
    gameOver();
  }
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(timestamp) {
  if (!state.running) return;
  if (state.paused) {
    dropTimer = requestAnimationFrame(gameLoop);
    return;
  }

  if (timestamp - state.lastDrop > state.dropInterval) {
    state.lastDrop = timestamp;
    moveDown();
  }

  drawBoard();
  dropTimer = requestAnimationFrame(gameLoop);
}

// ============================================================
// COLLISION
// ============================================================
function isColliding(piece, col, row) {
  if (col < 0 || col >= COLS) return true;
  if (row >= ROWS) return true;
  if (row >= 0 && state.board[row][col] !== null) return true;
  return false;
}

// ============================================================
// MOVEMENT
// ============================================================
function moveDown() {
  if (!state.current) return;
  const { col, row } = state.current;
  if (!isColliding(state.current, col, row + 1)) {
    state.current.row++;
  } else {
    placePiece();
  }
}

function moveLeft() {
  if (!state.current || state.paused) return;
  const { col, row } = state.current;
  if (!isColliding(state.current, col - 1, row)) {
    state.current.col--;
  }
}

function moveRight() {
  if (!state.current || state.paused) return;
  const { col, row } = state.current;
  if (!isColliding(state.current, col + 1, row)) {
    state.current.col++;
  }
}

function rotate() {
  if (!state.current || state.paused) return;
  // Toggle facing: word <-> translation
  state.current.facing = state.current.facing === 'word' ? 'translation' : 'word';
}

function hardDrop() {
  if (!state.current || state.paused) return;
  while (!isColliding(state.current, state.current.col, state.current.row + 1)) {
    state.current.row++;
    state.score += 1;
  }
  placePiece();
  updateScore();
}

// ============================================================
// PLACE & MATCH
// ============================================================
function placePiece() {
  const { col, row, word, translation, color, darkColor, facing } = state.current;
  if (row < 0) { gameOver(); return; }

  state.board[row][col] = { word, translation, color, darkColor, facing };
  state.current = null;

  flash('bad', 100);
  checkMatches();
  spawnPiece();
}

function checkMatches() {
  let anyMatch = false;

  if (state.gameMode === 'line') {
    // LINE MODE: find any row where ALL cells match (word ↔ translation pairs)
    // Actually: find pairs in the same row or adjacent columns
    // Simplified: if a word cell is adjacent to its translation in same row → match!
    checkPairMatches();
  } else {
    // TABLE MODE: check if every word in the set has been correctly placed
    checkPairMatches();
    updateTableProgress();
    if (state.matchedWords.size === state.wordSet.length) {
      tableComplete();
      return;
    }
  }
}

function checkPairMatches() {
  let cleared = [];

  // Check each cell: if word-facing cell is horizontally adjacent to matching translation-facing cell
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = state.board[r][c];
      if (!cell) continue;
      if (cell.facing === 'word') {
        // Check right neighbor
        if (c + 1 < COLS && state.board[r][c + 1]) {
          const neighbor = state.board[r][c + 1];
          if (neighbor.facing === 'translation' && neighbor.word === cell.word) {
            cleared.push([r, c], [r, c + 1]);
            recordMatch(cell.word, cell.translation);
          }
        }
        // Check left neighbor
        if (c - 1 >= 0 && state.board[r][c - 1]) {
          const neighbor = state.board[r][c - 1];
          if (neighbor.facing === 'translation' && neighbor.word === cell.word) {
            cleared.push([r, c], [r, c - 1]);
            recordMatch(cell.word, cell.translation);
          }
        }
      }
    }
  }

  // Also check: full rows (any cells in a complete row get cleared if all have matches)
  for (let r = 0; r < ROWS; r++) {
    const rowFull = state.board[r].every(c => c !== null);
    if (rowFull) {
      // Clear the row as bonus
      for (let c = 0; c < COLS; c++) {
        cleared.push([r, c]);
      }
    }
  }

  if (cleared.length === 0) {
    state.combo = 0;
    return;
  }

  // De-duplicate
  const unique = [];
  const seen = new Set();
  for (const [r, c] of cleared) {
    const key = r + '_' + c;
    if (!seen.has(key)) { seen.add(key); unique.push([r, c]); }
  }

  // Animate & clear
  flashCells(unique);
  setTimeout(() => {
    for (const [r, c] of unique) {
      state.board[r][c] = null;
    }
    // Drop cells above
    collapseBoard();
    state.combo++;
    const points = unique.length * 50 * state.combo;
    state.score += points;
    state.matched += Math.floor(unique.length / 2);
    updateScore();
    updateLevel();
    renderVocabList();
    flash('good', 150);
    showCombo(state.combo, points);
  }, 300);
}

function recordMatch(word, translation) {
  state.matchedWords.add(word);
}

function collapseBoard() {
  // For each column, drop cells down
  for (let c = 0; c < COLS; c++) {
    let writeRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (state.board[r][c] !== null) {
        state.board[writeRow][c] = state.board[r][c];
        if (writeRow !== r) state.board[r][c] = null;
        writeRow--;
      }
    }
    for (let r = writeRow; r >= 0; r--) {
      state.board[r][c] = null;
    }
  }
}

// ============================================================
// DRAW
// ============================================================
function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = '#080814';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * CELL);
    ctx.lineTo(canvas.width, r * CELL);
    ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * CELL, 0);
    ctx.lineTo(c * CELL, canvas.height);
    ctx.stroke();
  }

  // Board cells
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (state.board[r][c]) {
        drawCell(c, r, state.board[r][c]);
      }
    }
  }

  // Ghost piece
  if (state.current && !state.paused) {
    let ghostRow = state.current.row;
    while (!isColliding(state.current, state.current.col, ghostRow + 1)) {
      ghostRow++;
    }
    if (ghostRow !== state.current.row) {
      drawGhost(state.current.col, ghostRow, state.current);
    }
  }

  // Current piece
  if (state.current) {
    drawCell(state.current.col, state.current.row, state.current);
  }

  // Pause overlay
  if (state.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ffcc';
    ctx.font = 'bold 16px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
  }
}

function drawCell(col, row, data) {
  const x = col * CELL;
  const y = row * CELL;
  const pad = 3;

  // Background
  ctx.fillStyle = data.darkColor;
  roundRect(ctx, x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 5);
  ctx.fill();

  // Gradient overlay
  const grad = ctx.createLinearGradient(x + pad, y + pad, x + pad, y + CELL - pad);
  grad.addColorStop(0, 'rgba(255,255,255,0.15)');
  grad.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = grad;
  roundRect(ctx, x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 5);
  ctx.fill();

  // Border
  ctx.strokeStyle = data.color;
  ctx.lineWidth = 1.5;
  roundRect(ctx, x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 5);
  ctx.stroke();

  // Text
  const displayText = data.facing === 'word' ? data.word : data.translation;
  drawCellText(ctx, displayText, x + CELL / 2, y + CELL / 2, data.color, CELL - pad * 4);
}

function drawGhost(col, row, data) {
  const x = col * CELL;
  const y = row * CELL;
  const pad = 3;

  ctx.strokeStyle = data.color + '44';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  roundRect(ctx, x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 5);
  ctx.stroke();
  ctx.setLineDash([]);

  const displayText = data.facing === 'word' ? data.word : data.translation;
  ctx.globalAlpha = 0.3;
  drawCellText(ctx, displayText, x + CELL / 2, y + CELL / 2, data.color, CELL - pad * 4);
  ctx.globalAlpha = 1;
}

function drawCellText(ctx, text, cx, cy, color, maxWidth) {
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Dynamic font size
  let fontSize = 16;
  if (text.length > 6) fontSize = 12;
  if (text.length > 9) fontSize = 10;
  if (text.length > 12) fontSize = 8;

  ctx.font = `bold ${fontSize}px "Noto Sans TC", sans-serif`;

  // Word wrap if needed
  const words = text.split('');
  if (ctx.measureText(text).width > maxWidth && text.length > 4) {
    // Split into 2 lines
    const mid = Math.ceil(text.length / 2);
    const line1 = text.slice(0, mid);
    const line2 = text.slice(mid);
    ctx.fillText(line1, cx, cy - fontSize / 2 - 1);
    ctx.fillText(line2, cx, cy + fontSize / 2 + 1);
  } else {
    ctx.fillText(text, cx, cy);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================
// UI UPDATES
// ============================================================
function updateScore() {
  document.getElementById('scoreVal').textContent = state.score.toLocaleString();
  document.getElementById('levelVal').textContent = state.level;
  document.getElementById('linesVal').textContent = state.matched;
}

function updateLevel() {
  state.level = Math.floor(state.matched / 5) + 1;
  state.dropInterval = Math.max(150, 900 - (state.level - 1) * 80);
}

function updateNextDisplay() {
  if (!state.next) return;
  document.getElementById('nextWord').textContent = state.next.word;
  document.getElementById('nextTrans').textContent = state.next.translation;
}

function renderVocabList() {
  const list = document.getElementById('vocabList');
  list.innerHTML = '';
  const words = WORD_SETS[document.getElementById('wordSetSelect').value] || state.wordSet;
  for (const item of words) {
    const div = document.createElement('div');
    div.className = 'vocab-item' + (state.matchedWords.has(item.word) ? ' matched' : '');
    div.innerHTML = `
      <span class="v-word">${item.word}</span>
      <span class="v-trans">${item.translation}</span>
      <span class="v-check">${state.matchedWords.has(item.word) ? '✓' : ''}</span>
    `;
    list.appendChild(div);
  }
}

function updateTableProgress() {
  const total = state.wordSet.length;
  const done = state.matchedWords.size;
  const pct = total > 0 ? (done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total}`;
}

// ============================================================
// EFFECTS
// ============================================================
function flash(type, duration) {
  const el = document.getElementById('flashOverlay');
  el.className = 'flash-overlay flash-' + type;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, duration);
}

function flashCells(cells) {
  // Visual flash on canvas cells
  // We'll just do a quick highlight
  for (const [r, c] of cells) {
    if (state.board[r] && state.board[r][c]) {
      state.board[r][c]._flash = true;
    }
  }
}

function showCombo(combo, points) {
  const gameArea = document.getElementById('gameArea');
  const div = document.createElement('div');
  div.className = 'combo-display';
  div.style.top = '40%';

  if (combo >= 3) {
    div.textContent = `${combo}x COMBO! +${points}`;
    div.style.color = '#ffd93d';
  } else {
    div.textContent = `✓ +${points}`;
    div.style.color = '#6bcb77';
    div.style.fontSize = '14px';
  }

  gameArea.appendChild(div);
  setTimeout(() => div.remove(), 1000);
}

function showWordPopup(word, translation) {
  const gameArea = document.getElementById('gameArea');
  const div = document.createElement('div');
  div.className = 'word-popup';
  div.innerHTML = `<div class="wp-word">${word}</div><div class="wp-trans">${translation}</div>`;
  gameArea.appendChild(div);
  setTimeout(() => div.remove(), 1500);
}

// ============================================================
// GAME OVER
// ============================================================
function gameOver() {
  state.running = false;
  if (dropTimer) cancelAnimationFrame(dropTimer);

  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('startBtn').style.display = 'block';

  const overlay = document.getElementById('startOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="overlay-title" style="color:var(--accent2)">GAME OVER</div>
    <div class="overlay-sub">
      <span style="color:var(--accent3)">得分: ${state.score.toLocaleString()}</span><br>
      <span style="color:var(--accent4)">配對: ${state.matched} 個</span><br>
      <span style="color:var(--dim)">等級: ${state.level}</span>
    </div>
    <button class="overlay-btn" onclick="startGame()">▶ 再玩一次</button>
  `;
}

// ============================================================
// TABLE COMPLETE
// ============================================================
function tableComplete() {
  state.running = false;
  if (dropTimer) cancelAnimationFrame(dropTimer);

  document.getElementById('pauseBtn').style.display = 'none';

  const overlay = document.getElementById('startOverlay');
  overlay.style.display = 'flex';
  overlay.className = 'game-overlay table-complete-overlay';
  overlay.innerHTML = `
    <div class="overlay-title" style="color:var(--accent3)">🎉 完成！<br>TABLE CLEAR!</div>
    <div class="overlay-sub">
      你已學完所有單字！<br>
      <span style="color:var(--accent3)">得分: ${state.score.toLocaleString()}</span><br>
      <span style="color:var(--accent4)">配對: ${state.matched} 個</span>
    </div>
    <button class="overlay-btn" onclick="startGame()">▶ 再玩一次</button>
    <button class="overlay-btn" style="background:var(--accent4);margin-top:6px" onclick="resetGame()">選擇其他單字集</button>
  `;

  // Fireworks!
  for (let i = 0; i < 20; i++) {
    setTimeout(() => spawnFirework(overlay), i * 150);
  }
}

function spawnFirework(parent) {
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#00ffcc','#a78bfa','#fb923c'];
  for (let i = 0; i < 8; i++) {
    const dot = document.createElement('div');
    dot.className = 'firework';
    dot.style.background = colors[Math.floor(Math.random() * colors.length)];
    dot.style.left = (20 + Math.random() * 60) + '%';
    dot.style.top = (20 + Math.random() * 60) + '%';
    const angle = (i / 8) * Math.PI * 2;
    const dist = 40 + Math.random() * 60;
    dot.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    dot.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    dot.style.animationDelay = Math.random() * 0.3 + 's';
    parent.appendChild(dot);
    setTimeout(() => dot.remove(), 1500);
  }
}

// ============================================================
// PAUSE
// ============================================================
function togglePause() {
  if (!state.running) return;
  state.paused = !state.paused;
  document.getElementById('pauseBtn').textContent = state.paused ? '▶ RESUME' : '⏸ PAUSE';
}

// ============================================================
// KEYBOARD
// ============================================================
let keysHeld = {};

document.addEventListener('keydown', e => {
  if (!state.running) return;
  switch (e.code) {
    case 'ArrowLeft': e.preventDefault(); if (!keysHeld.left) { moveLeft(); keysHeld.left = setInterval(moveLeft, 120); } break;
    case 'ArrowRight': e.preventDefault(); if (!keysHeld.right) { moveRight(); keysHeld.right = setInterval(moveRight, 120); } break;
    case 'ArrowDown': e.preventDefault(); if (!keysHeld.down) { state.dropInterval = 80; keysHeld.down = true; } break;
    case 'ArrowUp': e.preventDefault(); rotate(); break;
    case 'Space': e.preventDefault(); hardDrop(); break;
    case 'KeyP': togglePause(); break;
  }
});

document.addEventListener('keyup', e => {
  switch (e.code) {
    case 'ArrowLeft': clearInterval(keysHeld.left); delete keysHeld.left; break;
    case 'ArrowRight': clearInterval(keysHeld.right); delete keysHeld.right; break;
    case 'ArrowDown':
      delete keysHeld.down;
      state.dropInterval = Math.max(150, 900 - (state.level - 1) * 80);
      break;
  }
});

function gameAction(action) {
  if (!state.running) return;
  switch(action) {
    case 'rotate': rotate(); break;
    case 'drop': hardDrop(); break;
  }
}

// ============================================================
// MOBILE
// ============================================================
function mobilePress(dir) {
  if (!state.running) return;
  if (dir === 'left') { moveLeft(); mobileIntervals.left = setInterval(moveLeft, 130); }
  if (dir === 'right') { moveRight(); mobileIntervals.right = setInterval(moveRight, 130); }
  if (dir === 'down') { state.dropInterval = 80; }
}

function mobileRelease(dir) {
  clearInterval(mobileIntervals[dir]);
  delete mobileIntervals[dir];
  if (dir === 'down') {
    state.dropInterval = Math.max(150, 900 - (state.level - 1) * 80);
  }
}

// ============================================================
// INIT
// ============================================================
initWordSets();
drawBoard();
</script>
