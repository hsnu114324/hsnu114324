<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WORDTRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root {
  --bg:        #07080f;
  --surface:   #0d0f1c;
  --border:    rgba(255,255,255,0.07);
  --border-hi: rgba(255,255,255,0.18);
  --text:      #c8cde8;
  --dim:       #3a3d5c;
  --mono:      'DM Mono', monospace;
  --sans:      'Noto Sans TC', sans-serif;
  --radius:    6px;

  /* Neon palette */
  --cyan:   #00f5ff;
  --pink:   #ff2d78;
  --gold:   #ffe600;
  --green:  #00ff88;
  --purple: #bf5fff;

  --glow-cyan:  0 0 12px rgba(0,245,255,0.5), 0 0 40px rgba(0,245,255,0.15);
  --glow-pink:  0 0 12px rgba(255,45,120,0.5), 0 0 40px rgba(255,45,120,0.15);
  --glow-gold:  0 0 12px rgba(255,230,0,0.5), 0 0 40px rgba(255,230,0,0.15);
  --glow-green: 0 0 12px rgba(0,255,136,0.5), 0 0 40px rgba(0,255,136,0.15);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* Noise texture */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 999; opacity: 0.6;
}

/* ── HEADER ── */
header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px 10px;
  border-bottom: 1px solid var(--border);
  position: relative; z-index: 1;
}

.logo {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 6px;
  color: var(--cyan);
  text-shadow: var(--glow-cyan);
}

.logo span { color: var(--pink); text-shadow: var(--glow-pink); }

.header-mode {
  display: flex;
  gap: 6px;
}

.tag {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  padding: 4px 10px;
  border-radius: 2px;
  border: 1px solid var(--border);
  color: var(--dim);
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
}

.tag.active-cyan  { border-color: var(--cyan);  color: var(--cyan);  box-shadow: var(--glow-cyan); }
.tag.active-pink  { border-color: var(--pink);  color: var(--pink);  box-shadow: var(--glow-pink); }

/* ── LAYOUT ── */
.layout {
  display: flex;
  gap: 20px;
  padding: 16px 20px 24px;
  align-items: flex-start;
  position: relative; z-index: 1;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 200px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}

.card-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2.5px;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: 8px;
}

/* Score */
.score-num {
  font-family: var(--mono);
  font-size: 32px;
  font-weight: 500;
  color: var(--gold);
  text-shadow: var(--glow-gold);
  line-height: 1;
}

.score-sub {
  display: flex;
  gap: 16px;
  margin-top: 10px;
}

.stat { flex: 1; }
.stat-n {
  font-family: var(--mono);
  font-size: 18px;
  color: var(--cyan);
  text-shadow: var(--glow-cyan);
}
.stat-l { font-size: 10px; color: var(--dim); margin-top: 1px; }

/* Next piece */
.next-box {
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 0;
}

.next-word {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  text-align: center;
  line-height: 1.3;
}

.next-fields {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
}

.next-field-tag {
  font-family: var(--mono);
  font-size: 9px;
  padding: 2px 5px;
  border-radius: 2px;
  border: 1px solid;
}

/* Field legend */
.field-legend {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text);
}

.legend-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

.legend-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--dim);
}

/* Word set selector */
select {
  width: 100%;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--sans);
  font-size: 12px;
  padding: 7px 10px;
  outline: none;
  cursor: pointer;
  appearance: none;
}
select:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,245,255,0.2); }

/* Buttons */
.btn {
  width: 100%;
  padding: 10px;
  border: 1px solid;
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  background: transparent;
}

.btn-primary {
  border-color: var(--cyan);
  color: var(--cyan);
}
.btn-primary:hover {
  background: rgba(0,245,255,0.08);
  box-shadow: var(--glow-cyan);
}

.btn-ghost {
  border-color: var(--border-hi);
  color: var(--dim);
}
.btn-ghost:hover { color: var(--text); border-color: var(--border-hi); }

/* Progress bar */
.prog-wrap {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  border-radius: 2px;
  height: 4px;
  overflow: hidden;
  margin-top: 6px;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  border-radius: 2px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 8px rgba(0,245,255,0.4);
}
.prog-text {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--dim);
  text-align: right;
  margin-top: 4px;
}

/* Keys */
.keys-grid { display: flex; flex-direction: column; gap: 5px; }
.key-row { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--dim); }
kbd {
  font-family: var(--mono);
  font-size: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border-hi);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 2px 6px;
  min-width: 26px;
  text-align: center;
  color: var(--text);
}

/* ── GAME AREA ── */
.game-area { position: relative; }

canvas {
  display: block;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

/* Canvas glow rim */
.canvas-rim {
  position: absolute; inset: -1px;
  border-radius: calc(var(--radius) + 1px);
  border: 1px solid rgba(0,245,255,0.12);
  pointer-events: none;
  box-shadow: 0 0 30px rgba(0,245,255,0.06);
}

/* ── OVERLAY ── */
.overlay {
  position: absolute; inset: 0;
  background: rgba(7,8,15,0.9);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  z-index: 20;
  gap: 6px;
}

.overlay-title {
  font-family: var(--mono);
  font-size: 20px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--cyan);
  text-shadow: var(--glow-cyan);
  margin-bottom: 4px;
}

.overlay-body {
  font-size: 12px;
  color: var(--dim);
  text-align: center;
  line-height: 2;
  margin-bottom: 10px;
}

.overlay-stat {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
}

.overlay-btn {
  padding: 10px 32px;
  border: 1px solid var(--cyan);
  border-radius: var(--radius);
  background: rgba(0,245,255,0.06);
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.15s;
  margin: 3px;
}
.overlay-btn:hover {
  background: rgba(0,245,255,0.14);
  box-shadow: var(--glow-cyan);
}
.overlay-btn.green {
  border-color: var(--green);
  color: var(--green);
  background: rgba(0,255,136,0.06);
}
.overlay-btn.green:hover {
  background: rgba(0,255,136,0.14);
  box-shadow: var(--glow-green);
}

/* Flash */
.flash {
  position: absolute; inset: 0;
  border-radius: var(--radius);
  pointer-events: none;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.08s;
}
.flash-good { background: rgba(0,255,136,0.18); }
.flash-bad  { background: rgba(255,45,120,0.14); }

/* Floating score */
.float-score {
  position: absolute;
  font-family: var(--mono);
  font-size: 13px;
  pointer-events: none;
  z-index: 30;
  white-space: nowrap;
  animation: floatUp 1s ease-out forwards;
}
@keyframes floatUp {
  0%   { opacity: 0; transform: translateY(0) scale(0.8); }
  15%  { opacity: 1; transform: translateY(-8px) scale(1.1); }
  70%  { opacity: 1; transform: translateY(-36px) scale(1); }
  100% { opacity: 0; transform: translateY(-70px) scale(0.9); }
}

/* Vocab list (right sidebar) */
.vocab-scroll {
  max-height: 340px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.vocab-scroll::-webkit-scrollbar { width: 3px; }
.vocab-scroll::-webkit-scrollbar-thumb { background: var(--border); }

.vocab-row {
  display: grid;
  gap: 4px;
  align-items: center;
  padding: 5px 6px;
  border-radius: 4px;
  font-size: 11px;
  border: 1px solid transparent;
  transition: all 0.35s;
  margin-bottom: 2px;
}

.vocab-row .v0 { font-weight: 700; }
.vocab-row .check { font-size: 10px; color: transparent; text-align: right; }

.vocab-row.done {
  background: rgba(0,255,136,0.06);
  border-color: rgba(0,255,136,0.15);
}
.vocab-row.done .check { color: var(--green); }

/* ── MOBILE ── */
.mobile-pad {
  display: none;
  gap: 8px;
  flex-direction: column;
  align-items: center;
  padding: 10px 0 20px;
}
.m-row { display: flex; gap: 8px; }
.m-btn {
  width: 58px; height: 58px;
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.m-btn:active { background: rgba(0,245,255,0.1); border-color: var(--cyan); color: var(--cyan); }

/* Firework particle */
.fw { position: absolute; width: 5px; height: 5px; border-radius: 50%; animation: fw 0.9s ease-out forwards; }
@keyframes fw {
  from { opacity:1; transform:translate(0,0) scale(1); }
  to   { opacity:0; transform:translate(var(--tx),var(--ty)) scale(0); }
}

@media (max-width: 740px) {
  .layout { flex-direction: column; align-items: center; padding: 10px; gap: 10px; }
  .sidebar { width: 100%; max-width: 360px; flex-direction: row; flex-wrap: wrap; }
  .sidebar .card { flex: 1; min-width: 140px; }
  .mobile-pad { display: flex; }
  .right-sidebar { width: 100%; max-width: 360px; }
}

/* ── CSV DROP ZONE ── */
.csv-drop {
  border: 1px dashed var(--border-hi);
  border-radius: var(--radius);
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.csv-drop:hover, .csv-drop.drag-over {
  border-color: var(--cyan);
  background: rgba(0,245,255,0.04);
  box-shadow: 0 0 0 1px rgba(0,245,255,0.2);
}
.csv-drop-icon { font-size: 22px; margin-bottom: 4px; }
.csv-drop-label { font-size: 11px; color: var(--dim); line-height: 1.6; }
.csv-drop-label b { color: var(--cyan); font-weight: 500; }
.csv-drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.csv-status {
  font-family: var(--mono);
  font-size: 9px;
  margin-top: 6px;
  padding: 4px 6px;
  border-radius: 3px;
  text-align: center;
  display: none;
}
.csv-status.ok  { background: rgba(0,255,136,0.1); color: var(--green); display: block; }
.csv-status.err { background: rgba(255,45,120,0.1); color: var(--pink);  display: block; }

.csv-hint {
  font-size: 10px;
  color: var(--dim);
  margin-top: 6px;
  line-height: 1.5;
}
.csv-hint code {
  font-family: var(--mono);
  font-size: 9px;
  background: rgba(255,255,255,0.05);
  padding: 1px 4px;
  border-radius: 2px;
  color: var(--gold);
}
.csv-dl {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--cyan);
  text-decoration: none;
  letter-spacing: 1px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  display: inline;
}
.csv-dl:hover { text-decoration: underline; }

/* ── CSV PREVIEW MODAL ── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(7,8,15,0.88);
  backdrop-filter: blur(10px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: 10px;
  width: 100%;
  max-width: 620px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 60px rgba(0,245,255,0.1);
}
.modal-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.modal-title {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--cyan);
  text-shadow: var(--glow-cyan);
}
.modal-close {
  background: none; border: none;
  color: var(--dim); font-size: 18px;
  cursor: pointer; line-height: 1;
  transition: color 0.1s;
}
.modal-close:hover { color: var(--text); }

.modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }

.preview-meta {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.preview-chip {
  font-family: var(--mono);
  font-size: 9px;
  padding: 3px 8px;
  border-radius: 2px;
  border: 1px solid;
  letter-spacing: 1px;
}

.preview-fields { margin-bottom: 14px; }
.preview-field-row {
  display: grid;
  grid-template-columns: 60px 1fr 80px 64px;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
  font-size: 11px;
}
.pf-label { font-family: var(--mono); font-size: 9px; color: var(--dim); letter-spacing: 1px; }

.pf-input {
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 11px;
  padding: 4px 7px;
  outline: none;
  width: 100%;
}
.pf-input:focus { border-color: var(--cyan); }

.pf-color { width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; padding: 1px; background: none; }

.preview-table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 14px;
}
.preview-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.preview-table th {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--dim);
  padding: 6px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.preview-table td {
  padding: 5px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  white-space: nowrap;
}
.preview-table tr:last-child td { border-bottom: none; }
.preview-table tr:hover td { background: rgba(255,255,255,0.02); }
.preview-more {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--dim);
  padding: 6px 10px;
  text-align: center;
}

.set-name-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 14px;
}
.set-name-row label { font-size: 11px; color: var(--dim); white-space: nowrap; }
.set-name-input {
  flex: 1;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 12px;
  padding: 5px 8px;
  outline: none;
}
.set-name-input:focus { border-color: var(--cyan); }

.modal-footer {
  padding: 12px 20px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  flex-shrink: 0;
}
.modal-btn {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  padding: 8px 20px;
  border-radius: var(--radius);
  border: 1px solid;
  cursor: pointer;
  transition: all 0.15s;
  background: transparent;
}
.modal-btn-cancel { border-color: var(--border-hi); color: var(--dim); }
.modal-btn-cancel:hover { color: var(--text); }
.modal-btn-confirm {
  border-color: var(--cyan);
  color: var(--cyan);
  background: rgba(0,245,255,0.06);
}
.modal-btn-confirm:hover { background: rgba(0,245,255,0.14); box-shadow: var(--glow-cyan); }
</style>
</head>
<body>

<header>
  <div class="logo">WORD<span>TRIS</span></div>
  <div class="header-mode">
    <div class="tag active-cyan" id="tagLine" onclick="setMode('line')">ENDLESS</div>
    <div class="tag" id="tagTable" onclick="setMode('table')">TABLE CLEAR</div>
  </div>
</header>

<div class="layout">

  <!-- ── LEFT SIDEBAR ── -->
  <div class="sidebar">

    <div class="card">
      <div class="card-label">Score</div>
      <div class="score-num" id="scoreNum">0</div>
      <div class="score-sub">
        <div class="stat">
          <div class="stat-n" id="levelNum">1</div>
          <div class="stat-l">LEVEL</div>
        </div>
        <div class="stat">
          <div class="stat-n" id="matchedNum">0</div>
          <div class="stat-l">CLEARED</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Next</div>
      <div class="next-box" id="nextBox">
        <div class="next-word" id="nextWordTxt">—</div>
        <div class="next-fields" id="nextFields"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Word Set</div>
      <select id="setSelect" style="margin-bottom:8px"></select>

      <div class="field-legend" id="fieldLegend"></div>
    </div>

    <div class="card">
      <div class="card-label">Import CSV</div>
      <div class="csv-drop" id="csvDrop">
        <input type="file" accept=".csv,text/csv" id="csvFileInput" onchange="handleCsvFile(this.files[0])">
        <div class="csv-drop-icon">📄</div>
        <div class="csv-drop-label">拖曳或點擊上傳 <b>.csv</b></div>
      </div>
      <div class="csv-status" id="csvStatus"></div>
      <div class="csv-hint">
        第一行為欄位名稱，之後每行一個單字<br>
        <code>德文,中文,陰陽性</code><br>

<script src="words.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  WORDTRIS ENGINE
// ═══════════════════════════════════════════════════════════════

// ── CONFIG (read from words.js) ──────────────────────────────
let fields = [];       // [{ key, label, color, abbr }]
let wordSets = {};
let currentSetName = '';
let currentWords = [];

// ── CANVAS ───────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CELL = 56;
const COLS = 8;
const ROWS = 13;
canvas.width  = COLS * CELL;
canvas.height = ROWS * CELL;

// ── STATE ─────────────────────────────────────────────────────
let S = {
  board: [],         // ROWS×COLS  null | { wordIdx, fieldIdx, color }
  current: null,     // falling piece
  next: null,
  score: 0,
  level: 1,
  cleared: 0,
  mode: 'line',
  running: false,
  paused: false,
  matchedSet: new Set(),
  dropMs: 850,
};

let raf = null;
let lastT = 0;
let held = {};
let mIntervals = {};

// ── INIT ──────────────────────────────────────────────────────
function init() {
  fields = WORD_CONFIG.fields;
  wordSets = WORD_CONFIG.word_sets;

  // Populate set selector
  const sel = document.getElementById('setSelect');
  sel.innerHTML = '';
  for (const name of Object.keys(wordSets)) {
    const o = document.createElement('option');
    o.value = o.textContent = name;
    sel.appendChild(o);
  }
  sel.value = WORD_CONFIG.default_set;
  sel.onchange = () => { if (!S.running) loadSet(sel.value); };

  loadSet(WORD_CONFIG.default_set);
  buildFieldLegend();
  renderVocab();
  drawIdle();
}

function loadSet(name) {
  currentSetName = name;
  currentWords = wordSets[name] || [];
  S.matchedSet = new Set();
  renderVocab();
  updateProgress();
}

function buildFieldLegend() {
  const el = document.getElementById('fieldLegend');
  el.innerHTML = '';
  for (const f of fields) {
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<div class="legend-dot" style="background:${f.color};box-shadow:0 0 6px ${f.color}88"></div>
      <span>${f.label}</span>
      <span class="legend-count" style="color:${f.color}">${f.abbr}</span>`;
    el.appendChild(row);
  }
}

// ── MODE ──────────────────────────────────────────────────────
function setMode(m) {
  if (S.running) return;
  S.mode = m;
  document.getElementById('tagLine').className  = 'tag' + (m === 'line'  ? ' active-cyan' : '');
  document.getElementById('tagTable').className = 'tag' + (m === 'table' ? ' active-pink' : '');
  document.getElementById('tableProgressCard').style.display = m === 'table' ? 'block' : 'none';
}

// ── GAME START ────────────────────────────────────────────────
function startGame() {
  const setName = document.getElementById('setSelect').value;
  loadSet(setName);

  S.board    = createBoard();
  S.score    = 0;
  S.level    = 1;
  S.cleared  = 0;
  S.matchedSet = new Set();
  S.running  = true;
  S.paused   = false;
  S.dropMs   = 850;

  hideOverlay();
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnPause').style.display = 'block';

  S.next    = makePiece();
  spawnPiece();
  updateHUD();
  renderVocab();

  if (raf) cancelAnimationFrame(raf);
  lastT = performance.now();
  raf = requestAnimationFrame(loop);
}

function resetGame() {
  if (raf) cancelAnimationFrame(raf);
  S.running = false;
  S.board   = createBoard();
  S.current = null;
  S.score = S.level = S.cleared = 0;
  S.matchedSet = new Set();

  document.getElementById('btnStart').style.display = 'block';
  document.getElementById('btnPause').style.display = 'none';

  showOverlay('WORDTRIS',
    '把同一個單字的所有欄位方塊<br><span style="color:var(--cyan)">由左到右依序排成一行</span>才能消除<br><br>按 <kbd>↑</kbd> 可切換方塊顯示的欄位',
    [{ label: '▶ START', fn: 'startGame()' }]
  );

  updateHUD();
  renderVocab();
  drawIdle();
}

// ── BOARD ─────────────────────────────────────────────────────
function createBoard() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

// ── PIECE ─────────────────────────────────────────────────────
// A "piece" is ONE cell wide, falling vertically.
// It represents ONE field of ONE word entry.
// When placed, we check for row-matches.
function makePiece() {
  const wi = Math.floor(Math.random() * currentWords.length);
  const fi = Math.floor(Math.random() * fields.length);
  return {
    wordIdx:  wi,
    fieldIdx: fi,
    col: Math.floor(COLS / 2),
    row: 0,
  };
}

function pieceColor(p) {
  return fields[p.fieldIdx].color;
}

function pieceText(p) {
  const word = currentWords[p.wordIdx];
  const f    = fields[p.fieldIdx];
  return word ? String(word[f.key] || '') : '?';
}

function pieceAbbr(p) {
  return fields[p.fieldIdx].abbr;
}

function spawnPiece() {
  S.current = S.next;
  S.current.col = Math.floor(COLS / 2);
  S.current.row = 0;
  S.next = makePiece();
  updateNextDisplay();

  if (isCollide(S.current.col, S.current.row)) {
    gameOver();
  }
}

// ── LOOP ──────────────────────────────────────────────────────
function loop(t) {
  if (!S.running) return;
  if (!S.paused && t - lastT > S.dropMs) {
    lastT = t;
    stepDown();
  }
  draw();
  raf = requestAnimationFrame(loop);
}

// ── MOVEMENT ─────────────────────────────────────────────────
function isCollide(col, row) {
  if (col < 0 || col >= COLS) return true;
  if (row >= ROWS) return true;
  if (row >= 0 && S.board[row][col] !== null) return true;
  return false;
}

function stepDown() {
  if (!S.current) return;
  if (!isCollide(S.current.col, S.current.row + 1)) {
    S.current.row++;
  } else {
    place();
  }
}

function moveLeft()  { if (S.current && !S.paused && !isCollide(S.current.col - 1, S.current.row)) S.current.col--; }
function moveRight() { if (S.current && !S.paused && !isCollide(S.current.col + 1, S.current.row)) S.current.col++; }

function rotatePiece() {
  if (!S.current || S.paused) return;
  // Cycle through fields of the SAME word
  S.current.fieldIdx = (S.current.fieldIdx + 1) % fields.length;
}

function hardDrop() {
  if (!S.current || S.paused) return;
  let bonus = 0;
  while (!isCollide(S.current.col, S.current.row + 1)) {
    S.current.row++;
    bonus++;
  }
  S.score += bonus;
  place();
  updateHUD();
}

// ── PLACE & MATCH ─────────────────────────────────────────────
function place() {
  const { col, row, wordIdx, fieldIdx } = S.current;
  if (row < 0) { gameOver(); return; }
  S.board[row][col] = { wordIdx, fieldIdx, color: fields[fieldIdx].color };
  S.current = null;

  doFlash('bad', 80);
  checkMatches();
  setTimeout(spawnPiece, 50);
}

// ──────────────────────────────────────────────────────────────
//  MATCH LOGIC
//  A "match" occurs when a complete row contains all fields of
//  a single word in the correct left-to-right field order.
//
//  "COMPLETE ROW" mode: the row must be fully filled AND contain
//  a valid sequence for each group of consecutive cells.
//
//  Simpler version we implement:
//  Scan every row. Find any horizontal run of (fields.length)
//  consecutive non-null cells where:
//    - all cells belong to the SAME wordIdx
//    - their fieldIdx matches fields[0..n-1] in order
//  That run is cleared.
// ──────────────────────────────────────────────────────────────
function checkMatches() {
  const n = fields.length;
  let toRemove = []; // [[r,c], ...]

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c <= COLS - n; c++) {
      // Check window [c .. c+n-1]
      let valid = true;
      const wi = S.board[r][c] ? S.board[r][c].wordIdx : -1;
      if (wi < 0) { valid = false; }
      if (valid) {
        for (let k = 0; k < n; k++) {
          const cell = S.board[r][c + k];
          if (!cell || cell.wordIdx !== wi || cell.fieldIdx !== k) {
            valid = false; break;
          }
        }
      }
      if (valid) {
        for (let k = 0; k < n; k++) toRemove.push([r, c + k]);
        S.matchedSet.add(wi);
      }
    }
  }

  if (toRemove.length === 0) { S.combo = 0; return; }

  // De-dup
  const seen = new Set();
  const unique = toRemove.filter(([r,c]) => {
    const k = r*100+c; if (seen.has(k)) return false; seen.add(k); return true;
  });

  // Animate clear
  unique.forEach(([r,c]) => {
    if (S.board[r][c]) S.board[r][c]._clear = true;
  });

  setTimeout(() => {
    unique.forEach(([r,c]) => { S.board[r][c] = null; });
    collapseBoard();
    const words = unique.length / n;
    const pts   = words * 100 * S.level;
    S.score  += pts;
    S.cleared += words;
    S.level   = Math.floor(S.cleared / 4) + 1;
    S.dropMs  = Math.max(120, 850 - (S.level - 1) * 70);
    updateHUD();
    renderVocab();
    updateProgress();
    doFlash('good', 150);
    showFloat(`+${pts}`, words >= 2 ? 'var(--gold)' : 'var(--green)');

    if (S.mode === 'table' && S.matchedSet.size === currentWords.length) {
      tableComplete();
    }
  }, 220);
}

function collapseBoard() {
  for (let c = 0; c < COLS; c++) {
    let wr = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (S.board[r][c]) { S.board[wr][c] = S.board[r][c]; if (wr !== r) S.board[r][c] = null; wr--; }
    }
    for (let r = wr; r >= 0; r--) S.board[r][c] = null;
  }
}

// ── DRAW ──────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // BG
  ctx.fillStyle = '#080a14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*CELL); ctx.lineTo(canvas.width, r*CELL); ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, canvas.height); ctx.stroke();
  }

  // Board
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = S.board[r][c];
      if (cell) drawCell(c, r, cell);
    }
  }

  // Ghost
  if (S.current && !S.paused) {
    let gr = S.current.row;
    while (!isCollide(S.current.col, gr + 1)) gr++;
    if (gr !== S.current.row) drawGhost(S.current.col, gr, S.current);
  }

  // Current
  if (S.current) drawCell(S.current.col, S.current.row, S.current);

  // Pause text
  if (S.paused) {
    ctx.fillStyle = 'rgba(7,8,15,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(0,245,255,0.9)';
    ctx.font = '500 14px "DM Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
  }
}

function drawIdle() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#080a14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*CELL); ctx.lineTo(canvas.width, r*CELL); ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, canvas.height); ctx.stroke();
  }
}

function drawCell(col, row, data) {
  const x = col * CELL, y = row * CELL;
  const pad = 4, r = 5;
  const color = data.color || fields[data.fieldIdx]?.color || '#fff';
  const isClearing = data._clear;
  const alpha = isClearing ? 0.4 : 1;

  ctx.globalAlpha = alpha;

  // Background
  ctx.fillStyle = colorWithAlpha(color, 0.1);
  roundRect(ctx, x+pad, y+pad, CELL-pad*2, CELL-pad*2, r);
  ctx.fill();

  // Neon border
  ctx.strokeStyle = color;
  ctx.lineWidth   = 1.5;
  ctx.shadowColor = color;
  ctx.shadowBlur  = 10;
  roundRect(ctx, x+pad, y+pad, CELL-pad*2, CELL-pad*2, r);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Abbr badge (top-right)
  const abbr  = fields[data.fieldIdx]?.abbr || '?';
  ctx.fillStyle = colorWithAlpha(color, 0.4);
  ctx.fillRect(x + CELL - pad - 18, y + pad + 1, 18, 11);
  ctx.fillStyle = color;
  ctx.font = '500 7px "DM Mono", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(abbr, x + CELL - pad - 9, y + pad + 7);

  // Main text
  const text = currentWords[data.wordIdx]
    ? String(currentWords[data.wordIdx][fields[data.fieldIdx]?.key] || '')
    : '?';

  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  drawFitText(ctx, text, x + CELL/2, y + CELL/2 + 4, CELL - pad*2 - 8);
  ctx.shadowBlur = 0;

  ctx.globalAlpha = 1;
}

function drawGhost(col, row, piece) {
  const x = col*CELL, y = row*CELL, pad = 4, r = 5;
  const color = fields[piece.fieldIdx].color;
  ctx.globalAlpha = 0.2;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  roundRect(ctx, x+pad, y+pad, CELL-pad*2, CELL-pad*2, r);
  ctx.stroke();
  ctx.setLineDash([]);

  const text = currentWords[piece.wordIdx]
    ? String(currentWords[piece.wordIdx][fields[piece.fieldIdx].key] || '') : '?';
  ctx.fillStyle = color;
  ctx.font = '700 11px "Noto Sans TC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text.slice(0,4), x + CELL/2, y + CELL/2);
  ctx.globalAlpha = 1;
}

function drawFitText(ctx, text, cx, cy, maxW) {
  let size = 15;
  if (text.length > 5)  size = 12;
  if (text.length > 8)  size = 10;
  if (text.length > 11) size = 8;
  ctx.font = `700 ${size}px "Noto Sans TC", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  if (ctx.measureText(text).width > maxW && text.length > 5) {
    const half = Math.ceil(text.length / 2);
    ctx.fillText(text.slice(0, half), cx, cy - size/2 - 1);
    ctx.fillText(text.slice(half),    cx, cy + size/2 + 1);
  } else {
    ctx.fillText(text, cx, cy);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function colorWithAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── HUD ───────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('scoreNum').textContent  = S.score.toLocaleString();
  document.getElementById('levelNum').textContent  = S.level;
  document.getElementById('matchedNum').textContent= S.cleared;
}

function updateNextDisplay() {
  if (!S.next) return;
  const w = currentWords[S.next.wordIdx];
  document.getElementById('nextWordTxt').textContent = w ? String(w[fields[0].key] || '—') : '—';

  const nf = document.getElementById('nextFields');
  nf.innerHTML = '';
  if (w) {
    for (const f of fields) {
      const tag = document.createElement('span');
      tag.className = 'next-field-tag';
      tag.style.borderColor = f.color + '99';
      tag.style.color = f.color;
      tag.textContent = String(w[f.key] || '');
      nf.appendChild(tag);
    }
  }
}

function updateProgress() {
  if (S.mode !== 'table') return;
  const total = currentWords.length, done = S.matchedSet.size;
  document.getElementById('progFill').style.width = (total ? done/total*100 : 0) + '%';
  document.getElementById('progText').textContent = `${done} / ${total}`;
}

function renderVocab() {
  const el = document.getElementById('vocabList');
  el.innerHTML = '';
  const cols = fields.length;
  for (let wi = 0; wi < currentWords.length; wi++) {
    const w    = currentWords[wi];
    const done = S.matchedSet.has(wi);
    const row  = document.createElement('div');
    row.className = 'vocab-row' + (done ? ' done' : '');
    row.style.gridTemplateColumns = `repeat(${cols}, 1fr) 14px`;

    let inner = '';
    fields.forEach((f, i) => {
      inner += `<span class="v${i}" style="color:${done ? 'var(--green)' : f.color}aa">${w[f.key]||''}</span>`;
    });
    inner += `<span class="check">${done ? '✓' : ''}</span>`;
    row.innerHTML = inner;
    el.appendChild(row);
  }
}

// ── EFFECTS ──────────────────────────────────────────────────
function doFlash(type, ms) {
  const el = document.getElementById('flash');
  el.className = `flash flash-${type}`;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', ms);
}

function showFloat(text, color) {
  const ga = document.getElementById('gameArea');
  const d  = document.createElement('div');
  d.className = 'float-score';
  d.textContent = text;
  d.style.color = color;
  d.style.textShadow = `0 0 10px ${color}`;
  d.style.left = (canvas.width / 2 - 30) + 'px';
  d.style.top  = (canvas.height / 2) + 'px';
  ga.appendChild(d);
  setTimeout(() => d.remove(), 1050);
}

// ── OVERLAY ───────────────────────────────────────────────────
function showOverlay(title, body, btns = []) {
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  document.getElementById('ovTitle').innerHTML = title;
  document.getElementById('ovBody').innerHTML  = body;

  // Remove old dynamic buttons
  ov.querySelectorAll('.dyn-btn').forEach(e => e.remove());
  for (const b of btns) {
    const btn = document.createElement('button');
    btn.className = `overlay-btn dyn-btn ${b.cls||''}`;
    btn.innerHTML = b.label;
    btn.setAttribute('onclick', b.fn);
    ov.appendChild(btn);
  }
}

function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

// ── GAME OVER ─────────────────────────────────────────────────
function gameOver() {
  S.running = false;
  cancelAnimationFrame(raf);
  document.getElementById('btnPause').style.display = 'none';
  document.getElementById('btnStart').style.display = 'block';

  showOverlay(
    '<span style="color:var(--pink)">GAME OVER</span>',
    `<span style="color:var(--gold)">Score: ${S.score.toLocaleString()}</span><br>
     <span style="color:var(--cyan)">Cleared: ${S.cleared}</span><br>
     <span style="color:var(--dim)">Level: ${S.level}</span>`,
    [{ label: '▶ PLAY AGAIN', fn: 'startGame()' }]
  );
}

// ── TABLE COMPLETE ────────────────────────────────────────────
function tableComplete() {
  S.running = false;
  cancelAnimationFrame(raf);
  document.getElementById('btnPause').style.display = 'none';
  document.getElementById('btnStart').style.display = 'block';

  showOverlay(
    '<span style="color:var(--gold)">COMPLETE!</span>',
    `所有單字都已配對完成！🎉<br>
     <span style="color:var(--gold)">Score: ${S.score.toLocaleString()}</span><br>
     <span style="color:var(--green)">全 ${currentWords.length} 個單字已學習</span>`,
    [
      { label: '▶ AGAIN', fn: 'startGame()', cls: '' },
      { label: '✦ OTHER SET', fn: 'resetGame()', cls: 'green' },
    ]
  );

  spawnFireworks();
}

function spawnFireworks() {
  const ga = document.getElementById('gameArea');
  const colors = ['#00f5ff','#ff2d78','#ffe600','#00ff88','#bf5fff'];
  let burst = 0;
  const iv = setInterval(() => {
    for (let i = 0; i < 10; i++) {
      const dot = document.createElement('div');
      dot.className = 'fw';
      dot.style.background = colors[Math.floor(Math.random()*colors.length)];
      dot.style.left = (10 + Math.random() * 80) + '%';
      dot.style.top  = (10 + Math.random() * 80) + '%';
      const a = (i/10)*Math.PI*2, d = 30 + Math.random()*50;
      dot.style.setProperty('--tx', Math.cos(a)*d+'px');
      dot.style.setProperty('--ty', Math.sin(a)*d+'px');
      dot.style.animationDelay = Math.random()*0.2+'s';
      ga.appendChild(dot);
      setTimeout(() => dot.remove(), 1200);
    }
    if (++burst > 8) clearInterval(iv);
  }, 200);
}

// ── PAUSE ─────────────────────────────────────────────────────
function togglePause() {
  if (!S.running) return;
  S.paused = !S.paused;
  document.getElementById('btnPause').textContent = S.paused ? '▶ RESUME' : '⏸ PAUSE';
  if (!S.paused) {
    lastT = performance.now();
    raf = requestAnimationFrame(loop);
  }
}

// ── KEYBOARD ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!S.running) return;
  switch (e.code) {
    case 'ArrowLeft':
      e.preventDefault();
      if (!held.L) { moveLeft(); held.L = setInterval(moveLeft, 110); }
      break;
    case 'ArrowRight':
      e.preventDefault();
      if (!held.R) { moveRight(); held.R = setInterval(moveRight, 110); }
      break;
    case 'ArrowDown':
      e.preventDefault();
      if (!held.D) { S.dropMs = 70; held.D = true; }
      break;
    case 'ArrowUp':
      e.preventDefault();
      rotatePiece();
      break;
    case 'Space':
      e.preventDefault();
      hardDrop();
      break;
    case 'KeyP':
      togglePause();
      break;
  }
});

document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft')  { clearInterval(held.L); delete held.L; }
  if (e.code === 'ArrowRight') { clearInterval(held.R); delete held.R; }
  if (e.code === 'ArrowDown')  {
    delete held.D;
    S.dropMs = Math.max(120, 850 - (S.level-1)*70);
  }
});

// ── MOBILE ───────────────────────────────────────────────────
function mStart(dir) {
  if (!S.running) return;
  if (dir === 'left')  { moveLeft();  mIntervals.left  = setInterval(moveLeft,  120); }
  if (dir === 'right') { moveRight(); mIntervals.right = setInterval(moveRight, 120); }
  if (dir === 'down')  { S.dropMs = 70; }
}
function mStop(dir) {
  clearInterval(mIntervals[dir]); delete mIntervals[dir];
  if (dir === 'down') S.dropMs = Math.max(120, 850 - (S.level-1)*70);
}

// ── BOOT ─────────────────────────────────────────────────────
init();

// ═══════════════════════════════════════════════════════════════
//  CSV IMPORT
// ═══════════════════════════════════════════════════════════════

// Neon colors to auto-assign to imported columns
const CSV_NEON = ['#00f5ff','#ff2d78','#ffe600','#00ff88','#bf5fff','#ff8c42','#4dffb4'];
const CSV_ABBR_FALLBACK = ['A','B','C','D','E','F','G'];

let csvParsed = null; // { headers, rows }

// ── Drag-and-drop wiring ──
(function() {
  const drop = document.getElementById('csvDrop');
  drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('drag-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) handleCsvFile(file);
  });
})();

// ── Parse & open modal ──
function handleCsvFile(file) {
  if (!file) return;
  const status = document.getElementById('csvStatus');

  // Reset file input so same file can be re-selected
  document.getElementById('csvFileInput').value = '';

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const result = parseCsv(e.target.result);
      if (result.headers.length < 2) throw new Error('至少需要 2 個欄位');
      if (result.rows.length === 0)  throw new Error('沒有資料列');
      csvParsed = result;
      status.className = 'csv-status ok';
      status.textContent = `✓ ${file.name}  (${result.rows.length} 筆)`;
      openCsvModal(result, file.name.replace(/\.csv$/i,''));
    } catch(err) {
      status.className = 'csv-status err';
      status.textContent = '✕ ' + err.message;
    }
  };
  reader.onerror = () => {
    const status = document.getElementById('csvStatus');
    status.className = 'csv-status err';
    status.textContent = '✕ 讀取失敗';
  };
  reader.readAsText(file, 'UTF-8');
}

// ── CSV parser (handles quoted fields & CRLF) ──
function parseCsv(text) {
  // Normalize line endings
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l => l.trim());
  if (lines.length < 2) throw new Error('CSV 至少需要 2 行（標題 + 資料）');

  const parse = line => {
    const result = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        result.push(cur.trim()); cur = '';
      } else {
        cur += ch;
      }
    }
    result.push(cur.trim());
    return result;
  };

  const headers = parse(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parse(lines[i]);
    if (cols.every(c => !c)) continue; // skip blank rows
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = cols[idx] || ''; });
    rows.push(obj);
  }
  return { headers, rows };
}

// ── Open preview modal ──
function openCsvModal({ headers, rows }, suggestedName) {
  document.getElementById('pvSetName').value = suggestedName || 'My Vocabulary';
  document.getElementById('pvRows').textContent = `${rows.length} WORDS`;
  document.getElementById('pvCols').textContent = `${headers.length} FIELDS`;

  // Field config rows
  const pvFields = document.getElementById('pvFields');
  pvFields.innerHTML = '';
  headers.forEach((h, i) => {
    const color = CSV_NEON[i % CSV_NEON.length];
    const abbr  = h.slice(0, 2).toUpperCase() || CSV_ABBR_FALLBACK[i];
    const row   = document.createElement('div');
    row.className = 'preview-field-row';
    row.innerHTML = `
      <span style="font-family:var(--mono);font-size:10px;color:var(--dim)">${h}</span>
      <input class="pf-input" id="pf-label-${i}" value="${h}" placeholder="欄位名稱">
      <input type="color" class="pf-color" id="pf-color-${i}" value="${color}"
        style="background:${color}22;border-color:${color}88"
        oninput="this.style.background=this.value+'22';this.style.borderColor=this.value+'88'">
      <input class="pf-input" id="pf-abbr-${i}" value="${abbr}" maxlength="3" placeholder="縮寫"
        style="max-width:54px">
    `;
    pvFields.appendChild(row);
  });

  // Table preview (first 8 rows)
  const thead = document.getElementById('pvTableHead');
  thead.innerHTML = '';
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    thead.appendChild(th);
  });

  const tbody = document.getElementById('pvTableBody');
  tbody.innerHTML = '';
  const PREVIEW_LIMIT = 8;
  rows.slice(0, PREVIEW_LIMIT).forEach(row => {
    const tr = document.createElement('tr');
    headers.forEach(h => {
      const td = document.createElement('td');
      td.textContent = row[h] || '';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  const pvMore = document.getElementById('pvMore');
  if (rows.length > PREVIEW_LIMIT) {
    pvMore.style.display = 'block';
    pvMore.textContent = `… 還有 ${rows.length - PREVIEW_LIMIT} 筆`;
  } else {
    pvMore.style.display = 'none';
  }

  document.getElementById('csvModal').style.display = 'flex';
}

function closeCsvModal() {
  document.getElementById('csvModal').style.display = 'none';
}

// ── Confirm import ──
function confirmCsvImport() {
  if (!csvParsed) return;
  const { headers, rows } = csvParsed;
  const setName = document.getElementById('pvSetName').value.trim() || 'Imported';

  // Build fields from modal inputs
  const newFields = headers.map((h, i) => ({
    key:   h,
    label: document.getElementById(`pf-label-${i}`).value.trim() || h,
    color: document.getElementById(`pf-color-${i}`).value,
    abbr:  document.getElementById(`pf-abbr-${i}`).value.trim().slice(0,3) || h.slice(0,2).toUpperCase(),
  }));

  // Update global fields
  fields = newFields;

  // Add word set
  if (!wordSets[setName]) {
    wordSets[setName] = rows;
    // Add option to selector
    const sel = document.getElementById('setSelect');
    const opt = document.createElement('option');
    opt.value = opt.textContent = setName;
    sel.appendChild(opt);
    sel.value = setName;
  } else {
    // Overwrite
    wordSets[setName] = rows;
    document.getElementById('setSelect').value = setName;
  }

  // Rebuild UI for new fields
  buildFieldLegend();
  loadSet(setName);
  closeCsvModal();

  // Status badge
  const status = document.getElementById('csvStatus');
  status.className = 'csv-status ok';
  status.textContent = `✓ 已匯入「${setName}」(${rows.length} 筆)`;
}

// ── Download sample CSV ──
function downloadSampleCsv() {
  // Build sample from current fields
  const hdrs = fields.map(f => f.label).join(',');
  const samples = (currentWords.slice(0, 5)).map(w =>
    fields.map(f => {
      const v = String(w[f.key] || '');
      return v.includes(',') ? `"${v}"` : v;
    }).join(',')
  );
  const csv = [hdrs, ...samples].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wordtris_sample.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
