<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>資料表編輯</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="settings-page">
      <section class="card">
        <h1>編輯資料表</h1>
        <p>格式：每列用逗號分隔，限制 2~5 欄（例如：<code>new,york,city</code>）。</p>
        <p id="message" class="message"></p>

        <div class="input-group">
          <input
            id="newRowInput"
            type="text"
            placeholder="輸入新列，例如：bubble,milk,tea"
          />
          <button id="addBtn" type="button">新增</button>
        </div>

        <div id="rowList" class="row-list"></div>

        <div class="actions">
          <button id="saveBtn" type="button">儲存</button>
          <button id="resetBtn" type="button">還原預設</button>
          <a class="btn-link" href="./index.html">回遊戲</a>
        </div>
      </section>
    </main>

    <script src="./settings.js"></script>
  </body>
</html>
