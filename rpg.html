<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Word RPG 德文單字冒險</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .rpg-page {
        width: min(96vw, 460px);
        margin: 0 auto;
        padding: 8px 0 20px;
        font-family: system-ui, sans-serif;
      }

      /* 導航 */
      .rpg-nav {
        display: flex;
        gap: 8px;
        justify-content: center;
        padding: 6px 0 10px;
      }

      /* 出題區 */
      .quiz-area {
        background: #181d3a;
        border: 1px solid #3f4b89;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 10px;
        text-align: center;
      }
      .quiz-hint {
        font-size: 1.1rem;
        color: #aab;
        margin-bottom: 4px;
      }
      .quiz-word {
        font-size: 1.6rem;
        font-weight: 700;
        color: #fff;
        margin: 6px 0 4px;
        min-height: 2rem;
      }
      .quiz-pair {
        font-size: 1.3rem;
        font-weight: 700;
        color: #ffcc02;
        margin: 4px 0 10px;
        min-height: 1.8rem;
      }
      .quiz-btns {
        display: flex;
        gap: 16px;
        justify-content: center;
        margin: 10px 0 6px;
      }
      .quiz-btns button {
        flex: 1;
        max-width: 140px;
        padding: 12px 0;
        font-size: 1.2rem;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.1s;
      }
      .quiz-btns button:active { transform: scale(0.95); }
      .btn-correct {
        background: #2a7a4a;
        color: #fff;
      }
      .btn-wrong {
        background: #8a2a2a;
        color: #fff;
      }
      .quiz-feedback {
        font-size: 1rem;
        min-height: 1.4rem;
        margin-top: 4px;
        font-weight: 600;
      }
      .quiz-stats {
        font-size: 0.85rem;
        color: #889;
        margin-top: 6px;
      }

      /* 仙劍遊戲區 — 用 transform scale 自動放大 */
      .game-container {
        position: relative;
        width: 100%;
        margin-bottom: 8px;
        border: 2px solid #3f4b89;
        border-radius: 8px;
        overflow: hidden;
        /* 高度由 JS 動態設定 */
      }
      .game-inner {
        /* 內層：固定 320×200，由 transform 放大 */
        width: 320px;
        height: 200px;
        transform-origin: 0 0;
        position: relative;
      }
      .game-container iframe {
        display: block;
        width: 320px;
        height: 200px;
        border: none;
        background: #000;
      }
      /* 遮罩：答對前阻擋互動 */
      .game-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 320px;
        height: 200px;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: opacity 0.3s;
        pointer-events: auto;
      }
      .game-overlay.unlocked {
        opacity: 0;
        pointer-events: none;
      }
      .game-overlay .lock-text {
        color: #ffcc02;
        font-size: 1.2rem;
        font-weight: 700;
        text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      }
      .game-overlay .lock-sub {
        color: #aab;
        font-size: 0.9rem;
        margin-top: 6px;
      }
      .timer-bar {
        height: 4px;
        background: #ffcc02;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 11;
        transition: width linear;
        border-radius: 2px;
      }

      /* 遊戲資訊 */
      .game-info {
        text-align: center;
        color: #aab;
        font-size: 0.9rem;
        margin-top: 6px;
      }
      .game-info b { color: #ffcc02; }

      /* ── 虛擬手把 ── */
      .vpad {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 8px;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      /* D-pad 容器 */
      .dpad {
        display: grid;
        grid-template-columns: 52px 52px 52px;
        grid-template-rows: 52px 52px 52px;
        gap: 2px;
      }
      .dpad button {
        width: 52px;
        height: 52px;
        border: none;
        border-radius: 10px;
        font-size: 1.3rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2a2f55;
        color: #ccd;
        transition: background 0.1s, transform 0.08s;
      }
      .dpad button:active {
        background: #3f4b89;
        transform: scale(0.92);
      }
      .dpad .blank {
        visibility: hidden;
      }
      /* 動作鍵 */
      .action-btns {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .action-btns button {
        width: 72px;
        height: 52px;
        border: none;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.1s, transform 0.08s;
      }
      .action-btns button:active {
        transform: scale(0.92);
      }
      .btn-action-confirm {
        background: #2a7a4a;
        color: #fff;
      }
      .btn-action-confirm:active { background: #35a05f; }
      .btn-action-menu {
        background: #5a4020;
        color: #ffcc02;
      }
      .btn-action-menu:active { background: #7a5830; }
    </style>
  </head>
  <body style="background:#0f1222;color:#eee;">

    <div class="rpg-page">
      <!-- 導航 -->
      <nav class="rpg-nav">
        <a class="btn-link" href="./index.html">🧱 方塊</a>
        <a class="btn-link" href="./snake.html">🐍 蛇</a>
        <a class="btn-link" href="./novel.html">📖 小說</a>
        <a class="btn-link" href="./settings.html">⚙ 設定</a>
        <button id="autoPlayBtn" style="padding:4px 12px;font-size:0.85rem;border-radius:6px;border:1px solid #3f4b89;background:#1a1f3d;color:#ccd;cursor:pointer;">🤖 自動</button>
        <button id="restartBtn" style="padding:4px 12px;font-size:0.85rem;border-radius:6px;border:1px solid #3f4b89;background:#1a1f3d;color:#ccd;cursor:pointer;">🔄 重新開始</button>
      </nav>

      <!-- 出題區 -->
      <section class="quiz-area">
        <div class="quiz-hint">這組配對正確嗎？</div>
        <div class="quiz-word" id="quizWord">—</div>
        <div class="quiz-pair" id="quizPair">—</div>
        <div class="quiz-btns">
          <button class="btn-correct" id="btnCorrect" type="button" onclick="answerQuiz(true)">✅ 對</button>
          <button class="btn-wrong" id="btnWrong" type="button" onclick="answerQuiz(false)">❌ 錯</button>
        </div>
        <div class="quiz-feedback" id="quizFeedback">&nbsp;</div>
        <div class="quiz-stats" id="quizStats">答對 0 / 答錯 0</div>
      </section>

      <!-- 仙劍遊戲 -->
      <section class="game-container" id="gameContainer">
        <div class="game-inner" id="gameInner">
          <div class="timer-bar" id="timerBar" style="width:0%"></div>
          <div class="game-overlay" id="gameOverlay">
            <div class="lock-text">🔒 請先回答上方題目</div>
            <div class="lock-sub">答對後可操作遊戲 5 秒</div>
          </div>
          <iframe id="gameFrame" src="./xianjian-master/index.html" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </section>

      <!-- 虛擬手把 -->
      <div class="vpad" id="vpad">
        <div class="dpad">
          <button class="blank"></button>
          <button data-key="38">▲</button>
          <button class="blank"></button>
          <button data-key="37">◀</button>
          <button data-key="32" style="font-size:0.7rem;color:#ffcc02;">確認</button>
          <button data-key="39">▶</button>
          <button class="blank"></button>
          <button data-key="40">▼</button>
          <button class="blank"></button>
        </div>
        <div class="action-btns">
          <button class="btn-action-confirm" data-key="32">⭕ 確認</button>
          <button class="btn-action-menu" data-key="27">☰ 選單</button>
        </div>
      </div>

      <!-- 遊戲資訊 -->
      <div class="game-info">
        答對可操作 <b id="rewardSeconds">5</b> 秒 ｜
        連續答對：<b id="streakEl">0</b>
      </div>
    </div>

    <script src="./rpg.js"></script>
  </body>
</html>
